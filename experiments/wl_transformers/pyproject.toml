[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wl-transformers"
version = "0.1.0"
description = "Graph transformer / GINE harness with PRiSM-canonicalized Laplacian positional encodings"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "prism-canonicalization[torch]",
    "numpy<2",
    "scipy",
    "torch>=2.1",
    "torchvision",
    "torch_geometric>=2.4",
    "hydra-core>=1.3",
    "loguru",
    "tqdm",
    "prettytable",
]

[project.optional-dependencies]
wandb = ["wandb"]

[tool.setuptools.packages.find]
include = ["wl_transformers*"]

[tool.setuptools.package-data]
wl_transformers = ["conf/**/*.yaml"]
