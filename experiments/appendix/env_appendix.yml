# Environment of the appendix tables (r-bound statistics, eigenvalue multiplicities,
# empirical invariance, noise sensitivity, runtime scaling).  CPU only.
#
#   PYTHONNOUSERSITE=1 conda env create -p ./env_appendix -f env_appendix.yml     # run from this directory
#   conda activate ./env_appendix
#   export PYTHONNOUSERSITE=1      # keep packages of ~/.local out of the environment
#
# The last line installs the repository's `prism` package in editable mode (path relative to
# this file).  numpy is pinned explicitly: torch 2.2 is built against numpy 1.x.
name: prism-appendix
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - numpy==1.26.4
      - scipy==1.15.3
      - networkx==3.4.2
      - torch==2.2.0+cpu
      - torch-geometric==2.4.0
      - ogb==1.3.6
      - pandas==2.3.3
      - scikit-learn==1.7.2
      - pytest==9.0.2
      - -e ../..
